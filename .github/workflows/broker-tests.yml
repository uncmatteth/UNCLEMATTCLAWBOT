name: Broker Tests

on:
  push:
    paths:
      - "broker/**"
      - ".github/workflows/broker-tests.yml"
  pull_request:
    paths:
      - "broker/**"
      - ".github/workflows/broker-tests.yml"

jobs:
  broker-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: broker/package-lock.json

      - name: Install
        run: npm ci
        working-directory: broker

      - name: Build
        run: npm run build
        working-directory: broker

      - name: Test
        run: npm test
        working-directory: broker
